name: CI

# Her push ve pull request'te statik analiz + test çalışır.
# Amaç: release'in yalnızca bu bilgisayardaki "Apk Hazırla.bat" ile
# yapılabilmesi riskini kırmak ve regresyonu yakalamak.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analiz + Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depo
        uses: actions/checkout@v4

      # --- GUARD: E2E (integration_test) bilinçli olarak KALDIRILDI ---
      #
      # Kullanıcı kararı: uçtan uca test katmanı bu projede YOK ve bir daha
      # eklenmeyecek. Bu kapı, yanlışlıkla (bir deneme sırasında, bir eklenti
      # tarafından ya da bir AI ajanı tarafından) geri getirilmesini engeller:
      # biri eklerse CI KIRMIZI olur ve dağıtım durur. Kodun kendisinden
      # bağımsız, süreç düzeyinde bir yasaktır.
      - name: E2E kapalı kalmalı
        run: |
          set -euo pipefail
          fail=0
          if [ -d integration_test ]; then
            echo "::error file=integration_test::integration_test/ klasörü eklendi. E2E bu projede bilinçli olarak kaldırıldı (kullanıcı kararı) ve yeniden eklenmemeli."
            fail=1
          fi
          if [ -f pubspec.yaml ] && grep -qE '^[[:space:]]*integration_test:' pubspec.yaml; then
            echo "::error file=pubspec.yaml::pubspec.yaml içinde integration_test bağımlılığı var. E2E bu projede bilinçli olarak kaldırıldı (kullanıcı kararı) ve yeniden eklenmemeli."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Kaldırılacaklar: integration_test/ klasörü ve pubspec.yaml dev_dependencies altındaki integration_test satırı."
            exit 1
          fi
          echo "E2E kapalı - doğrulandı (klasör yok, bağımlılık yok)."

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Bağımlılıklar
        run: flutter pub get

      # flutter analyze bilgi seviyesindeki ihlallerde de 1 döner;
      # proje temiz tutulduğu için bunu hata sayıyoruz.
      - name: Statik analiz
        run: flutter analyze

      # `--concurrency=1`: test dosyaları **seri** koşar.
      #
      # Gerekçe: sunucu testleri (FTP/SMB) gerçek TCP portu kullanır. Test
      # dosyaları paralel koştuğunda bir dosyanın "boş bulup kapattığı" port,
      # diğer dosyanın dinleyicisi tarafından tahsis edilebiliyordu — bu
      # depoda FTPS dinleyicisine yanlış istemci bağlanıp `Broken pipe`
      # üretiyor ve FTP testini düşürüyordu. Portlar artık işletim
      # sistemi tarafından tahsis edilse de (port 0) ve "kapalı port"
      # testleri 127.0.0.2 üzerinden dönsede, seri çalıştırmak bu sınıfın
      # tamamını bir daha imkânsız kılar. Test süresi birkaç dakika uzar;
      # kararlılık hızdan önce gelir.
      - name: Testler
        run: flutter test --reporter expanded --concurrency=1
