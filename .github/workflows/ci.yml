name: CI

# Her push ve pull request'te statik analiz + test çalışır.
# Amaç: release'in yalnızca bu bilgisayardaki "Apk Hazırla.bat" ile
# yapılabilmesi riskini kırmak ve regresyonu yakalamak.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analiz + Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depo
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Bağımlılıklar
        run: flutter pub get

      # flutter analyze bilgi seviyesindeki ihlallerde de 1 döner;
      # proje temiz tutulduğu için bunu hata sayıyoruz.
      - name: Statik analiz
        run: flutter analyze

      - name: Testler
        run: flutter test --reporter expanded
